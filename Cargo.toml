# CRUCIBLE runtime workspace — layout mirrors the doc families (META-2 §4):
# one crate per FND/COUP/SOLV area; each code unit cites the doc ID + version it implements.
[workspace]
resolver = "3"
members = [
    "crates/constants",
    "crates/units",
    "crates/registry",
    "crates/config",
    "crates/tables",
    "crates/grid",
    "crates/solvers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.lints.rust]
# META-2 §4: `unsafe` requires a written in-line justification and is avoided in
# physics paths — deny globally, override locally with the justification attached.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Certificates regenerate under --release (gate 5): keep overflow checks ON
# there too — the session-7 θ-wrap underflow was caught only by checked
# arithmetic, and a silent wrap in a certificate binary would bless wrong
# numbers (review finding). f64 results are unaffected; the integer-check
# cost is noise next to the marches.
[profile.release]
overflow-checks = true

# The certificate studies (Goal A conduction, Station 1 Sod ladder) are real
# solver marches; unoptimized they multiply the fast-gate wall time ~20×.
# Optimization level does not change f64 results in Rust (no fast-math, no
# reassociation — META-1 §2.2), so test-profile output is bit-identical to
# dev/release; VAL-3's determinism gates would catch any regression of that.
[profile.test]
opt-level = 2
