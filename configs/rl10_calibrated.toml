# RL10A-3-3A, CALIBRATED (closed-mode) preset — VAL-2 §3.2's calibrated
# member: binds the anchor's OWN measured component data (TM-107318 Tables
# 2.2.1/2.3.1/2.4.1/2.6.1 pump heads+η, turbine PR/flow; the fitted
# η_c* = 0.9892) — every score from this config is labeled CALIBRATED,
# never blind. The expander loop closes: delivered ṁ = COUP-3 §3.5 fixed
# point on the computed jacket pickup (engages after the establishment
# window; the start sequence is out of scope). Development declared OPEN
# (`development-observed: yes`, VISION_SCOPE §9 v1.4.1).
#
# Run from the repository root:  cargo run --release -p crucible -- run configs/rl10_calibrated.toml
schema_version = 1

[meta]
name = "rl10-calibrated"
description = "RL10A-3-3A closed-mode (expander) steady march, calibrated tier (cells_across_throat = 5)"

[geometry]
n_theta_max = 1
axisymmetric = true # recorded axisymmetry assertion (FND-2 §3.4) — the RL10 contour is a body of revolution
contour = "data/anchors/rl10_contour.csv"
contour_units = "in"
# Liner ring GRID-THICKENED to ~1.6 coarse cells (real tube wall: 0.33 mm
# SS-347 + silver girdle, thermally negligible R ≈ 2e-5 m²K/W); the
# conduction kappa below preserves that negligible wall resistance. The
# ring sits outboard of the κ = 0 boundary (session 12: gas = every cell
# the contour touches, FND-3 fractions).
liner_thickness_m = 0.02
cells_across_throat = 5.0 # THE fidelity dial: cell = r_throat/5 ≈ 12.5 mm

[mechanisms.flow]
type = "flow_shifting" # SOLV-1 shifting-equilibrium mode on the pinned (p,h,Z) surface

[mechanisms.injector]
type = "injector_prior" # COUP-7 §3.2.1 prior tier: premixed at MR + the S18 knockdown
mdot_kg_per_s = 16.9465  # design total flow, 37.36 lbm/s (TM-107318 Table 2.5.1) — the closed loop's warm start; delivered ṁ is solved
mixture_ratio = 5.0      # design O/F (rl10-cycle-data)
h_inj_j_per_kg = -1083091.499726406 # liquid-injection enthalpy at MR 5 (station-3 pinned CEA datum, H2(L) 20.27 K / O2(L) 90.17 K)
eta_cstar = 0.9892       # the anchor's OWN fitted η_c* (rl10-cycle-data) — CALIBRATED-mode-only datum
h_offset_j_per_kg = -3.85e5 # S18 realization: measured coarse slope -0.847% c* per -3.0e5 J/kg (session-12 calibration pair: rl10-coarse vs rl10-hoffset-trial) => ln(0.9892)/0.00847*3e5; realized η is re-measured and reported by the certificate

[mechanisms.turbopump]
type = "turbopump_expander" # COUP-7 §3.2 closed mode: TM-107318 component data (CALIBRATED-only)
mdot_design_kg_per_s = 16.9465
# Σ ṁ·g·H/η over the map's stages + shaft drag, at the design point:
#   fuel stg1: 2.7447 kg/s × 9.80665 × 5172.15 m / 0.5810 = 239.6 kW   (Table 2.2.1)
#   fuel stg2: 2.7252 kg/s × 9.80665 × 5483.05 m / 0.5619 = 260.8 kW
#   LOX:      14.2428 kg/s × 9.80665 ×  369.42 m / 0.6422 =  80.3 kW   (Table 2.3.1)
#   TP drag:  20 lbf·in @ 31537 rpm                        =   7.5 kW
pump_power_design_w = 5.882e5
impedance_exponent = 3.0 # P_pump ∝ ṁ³ along the fixed feed impedance line (head ∝ ṁ², Table 2.6.1 orifice class)
turbine_mdot_frac = 0.15766 # 5.89 / 37.36 lbm/s (Table 2.2.1; jacket bypass excluded)
turbine_eta = 0.70 # closes the design-point power balance with the tabled heads/η/PR (partial-admission impulse class, huzel-huang 0.65–0.75)
turbine_pressure_ratio = 1.39 # T-T, Table 2.2.1
turbine_gamma = 1.40 # cold H2
coolant_cp_j_per_kg_k = 16270.0 # jacket-consistent effective cp: Q/(ṁ·ΔT) from Table 2.4.1 (8.433 MW / 2.709 kg/s / 191.3 K)
coolant_t_in_k = 32.0 # jacket inlet (pump discharge) class
mdot_envelope_lo_frac = 0.5 # near-design map validity (App. B/C maps; outside = won't-bootstrap)
mdot_envelope_hi_frac = 1.5

[mechanisms.liner]
type = "conduction"
# Resistance-preserving effective conductivity of the grid-thickened liner:
# any κ making d_half/κ ≪ the film resistances reproduces the real series
# (the physical wall is negligible); 2000 keeps the modeled wall ≤ ~10% of
# the film sum at every dial.
kappa_w_per_m_k = 2000.0
# Declared steady-state continuation device (station-4 finding: the steady
# solution is independent of ρc_p); sized to keep the solid clock ~10³
# faster than physical while respecting the coupled stability guards.
rho_cp_j_per_m3_k = 1000.0

[mechanisms.wall]
type = "wall_heat" # SOLV-1 §3.5's ONE Colburn-class law, ±20–30% declared band
# Transport constants at chamber conditions — the degenerate FND-7 spine
# occupant (OFFL-5 transport feed retires them): LOX/LH2 products, M ≈ 13.6,
# T_c ≈ 3200 K.
cp_j_per_kg_k = 5000.0
mu_pa_s = 1.0e-4
pr = 0.6

[mechanisms.jacket]
type = "jacket_coolant" # COUP-7 coolant side ONLY (D-C): declared film + coolant state; channel correlation set lands with the cycle wave
h_w_per_m2_k = 30000.0 # supercritical-H2 channel film class (huzel-huang)
t_coolant_k = 120.0    # jacket-average coolant temperature (inlet 32 K + ~191 K rise, TM Table 2.4.1)

[engine.bindings]
"flow.inflow" = "injector.combustion_inlet" # O20: nothing auto-matches
"turbopump.drive_power" = "jacket.heat_pickup" # the wall-exchange coupler's Provide (COUP-7 §4)

[operating_profile]
mode = "steady_march"
# Session 12: FND-3 partial apertures + State Redistribution retired the
# exit-lip starvation (the session-11 KNOWN LIMIT — stair small-cut-cell
# class). The coarse tier now marches through the old ~2.9-FT death point
# to a settled readout; 12 flow-throughs ≈ 4 min laptop serial.
flowthroughs = 12.0 # settle budget in fill-state acoustic span times
fill_p_pa = 3.0e6   # quiescent startup fill near the expected operating class (steady result is fill-independent)
pumpdown_flowthroughs = 4.0 # altitude-cell ambient pump-down window (quasi-static nozzle establishment)
p_amb_floor_pa = 100.0 # declared altitude-cell floor (~1 mbar class): keeps the settled plume fringe inside the v0.3.0 surface's cold envelope (zero pinned cells — checkable in fields.csv)
cfl = 0.4

[tables.chem_equilibrium]
file = "tables/chem/lox_lh2_v0.3.2.h5"
group = "/chem/lox_lh2/equilibrium"
pins = "tables/chem/lox_lh2_v0.3.2.pins.toml" # the machine-written single pin owner

[determinism]
mode = "fixed-order"

[rng]
master_seed = 11
