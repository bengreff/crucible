[package]
name = "crucible-solvers"
description = "SOLV-family operators on the world-state grid (first: conduction)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
crucible-units = { path = "../units" }
crucible-config = { path = "../config" }
crucible-grid = { path = "../grid" }
crucible-registry = { path = "../registry" }
crucible-tables = { path = "../tables" }
# FND-2 §3.7 parallel path: work is partitioned by brick rows/columns so
# every cell's accumulation order is thread-count-independent (bit-exact
# at any N — asserted by test).
rayon = "1.10"

[dev-dependencies]
# Station tests parse the pins.toml sidecar (single pin owner, session-10
# convention shared with crucible-tables).
toml = "0.8"

[lints]
workspace = true
