# RL10A-3-3A, FULL fidelity tier — the desktop preset (~an hour, serial).
# Blind-config inputs only (VAL-2 §3.2 N18/D-G): geometry-of-record CSV,
# design-spec flow/MR, universal closures. Nothing here is measured on RL10
# (the design ṁ/MR/ε are the specification; the fitted η_c* = 0.9892 and
# measured pump maps are calibrated-mode-only and absent). Development is
# declared OPEN (`development-observed: yes`, VISION_SCOPE §9 v1.4.1).
#
# Run from the repository root:  cargo run --release -p crucible -- run configs/rl10_full.toml
schema_version = 1

[meta]
name = "rl10-full"
description = "RL10A-3-3A open-mode steady march, full tier (cells_across_throat = 16)"

[geometry]
n_theta_max = 1
axisymmetric = true # recorded axisymmetry assertion (FND-2 §3.4) — the RL10 contour is a body of revolution
contour = "data/anchors/rl10_contour.csv"
contour_units = "in"
# Liner ring GRID-THICKENED to ~2 cells (real tube wall: 0.33 mm
# SS-347 + silver girdle, thermally negligible R ≈ 2e-5 m²K/W); the
# conduction kappa below preserves that negligible wall resistance. FND-3
# partial apertures retire the thickening.
liner_thickness_m = 0.008
cells_across_throat = 16.0 # THE fidelity dial: cell = r_throat/16 ≈ 3.9 mm

[mechanisms.flow]
type = "flow_shifting" # SOLV-1 shifting-equilibrium mode on the pinned (p,h,Z) surface

[mechanisms.injector]
type = "injector_prior" # COUP-7 §3.2.1 prior tier: premixed at MR; η_c* knockdown lands with the cycle wave (full equilibrium until then, declared)
mdot_kg_per_s = 16.9465  # design total flow, 37.36 lbm/s (TM-107318 Table 2.5.1)
mixture_ratio = 5.0      # design O/F (rl10-cycle-data)
h_inj_j_per_kg = -1083091.499726406 # liquid-injection enthalpy at MR 5 (station-3 pinned CEA datum, H2(L) 20.27 K / O2(L) 90.17 K)
eta_cstar = 0.98         # BLIND: the coax-injector-family prior band MID (0.97–0.99, injector-cstar-eff; NOT the RL10 fitted value)
h_offset_j_per_kg = -7.16e5 # S18 realization of the band mid (measured slope -0.847% c* per -3.0e5 J/kg); band edges bracketed at the coarse tier (certificate §band)

[mechanisms.liner]
type = "conduction"
# The grid-thickened ring's TWO declared homogenizations (META-3 §6.10).
# Resistance-preserving effective conductivity: any κ making d_half/κ ≪ the
# film resistances reproduces the real series (the physical wall is
# negligible); 2000 keeps the modeled wall ≤ ~10% of the film sum at every
# dial.
kappa_w_per_m_k = 2000.0
# Capacitance-preserving volumetric heat capacity — PHYSICAL thermal mass
# (plan ruling #4; the ~10³-fast continuation device is retired at S4).
# The real wall is 0.33 mm of SS-347 (ρc_p ≈ 3.95e6 J/(m³·K), META-3
# `ss347-liner-thermal`), so the modeled 8 mm ring must carry the same
# thermal mass PER UNIT WALL AREA — which is what sets the expander
# bootstrap clock — not the same ρc_p:
#   3.95e6 × (0.33e-3 / 0.008) = 1.63e+05 J/(m³·K).
# Both homogenizations retire together when the liner is resolved at
# physical thickness (plan §3, THE RUN). The silver braze girdle's share is
# excluded — declared, a faster wall clock.
rho_cp_j_per_m3_k = 162938

[mechanisms.wall]
type = "wall_heat" # SOLV-1 §3.5's ONE Colburn-class law, ±20–30% declared band
# Parameter-free since S4: μ, k, c_p, Pr are FND-7 spine queries at the
# near-wall state (the law states no transport constant of its own).

[mechanisms.transport]
# FND-7 §3.3 — the spine's transport slot, TABULATED occupant (S4): the
# OFFL-5 §3.1a chemical-regime surface, μ/k/c_p/c_v/∂h∂Z over the same
# (p, h, Z) local state as the equilibrium EOS surface, declared band
# 10–20%. This is what retires the three constants that used to sit in
# `[mechanisms.wall]` above (LOX/LH2 products at chamber conditions —
# accurate there, wrong by ×10 in the plume fringe where dissociation runs).
type = "transport_table"
# The one-composition-coordinate Fickian closure ρD = μ/Sc, closing TWO
# fluxes: the species flux and the temperature limb of the species-enthalpy
# flux (which the spine folds into the effective conductivity).
# 0.40 is MEASURED, not assumed (S4 review): imposing a pure ∇Z at fixed
# (T, p) along the equilibrium manifold and contracting the mixture-averaged
# species fluxes onto the elemental fuel fraction gives Sc_eff = 0.402–0.412
# across four decades of pressure — remarkably constant. Declared band ±0.3
# (META-3 `schmidt-combustion-gas`). The 0.5 this replaced left the
# effective conductivity 21–32% below the mixture-averaged truth; 0.40
# brings it to ~11%, inside the declared 10–20%.
schmidt = 0.40

[mechanisms.gasvisc]
# SOLV-1 §3.1's F_visc — the missing forces ON (plan S3 built it, S4 wires
# it). Parameter-free: every coefficient is a spine query.
type = "gas_diffusion"

[mechanisms.jacket]
type = "jacket_coolant" # COUP-7 coolant side ONLY (D-C): declared film + coolant state; channel correlation set lands with the cycle wave
h_w_per_m2_k = 30000.0 # supercritical-H2 channel film class (huzel-huang)
t_coolant_k = 120.0    # jacket-average coolant temperature (inlet 32 K + ~191 K rise, TM Table 2.4.1)

[engine.bindings]
"flow.inflow" = "injector.combustion_inlet" # O20: nothing auto-matches

[operating_profile]
mode = "steady_march"
# KNOWN LIMIT (session 12; comment corrected session 13): dials ≥ 8 cannot
# ESTABLISH by physical march under the honest rule-space projection
# acceptance — the startup transient (drain/shear at the bell wall, injector
# piston, or overexpanded-bell backflow, depending on the schedule; five
# schedules probed, each halting at a different envelope edge) manufactures
# mixture states genuinely outside the equilibrium surface's representable
# set, and the operator rightly refuses (never clamps). The pre-review
# dial-8 "success" rode the vacuous absolute acceptance bound the session-12
# review retired: the certified tier is dial 5 ONLY (the certificate is the
# record). Cure (VISION_SCOPE v1.5 — accelerated convergence is DELETED;
# establishment stays a physical march): the PLAN_CHEMICAL_SANDBOX Phase 1-2
# physics (gas diffusion + implicit integrator + the cold/unburnt chemistry
# branch) makes these transient states representable and conductively
# coupled instead of refused; grid-sequenced restart from settled physical
# states (FND-6) remains the legal warm-start. This preset is the waiting
# full tier until that wave lands.
flowthroughs = 12.0 # settle budget in fill-state acoustic span times
fill_p_pa = 3.0e6   # quiescent startup fill near the expected operating class (steady result is fill-independent)
pumpdown_flowthroughs = 4.0 # altitude-cell ambient pump-down window (quasi-static nozzle establishment)
p_amb_floor_pa = 100.0 # declared altitude-cell floor (~1 mbar class): keeps the settled plume fringe inside the v0.3.0 surface's cold envelope
cfl = 0.4

[tables.chem_equilibrium]
file = "tables/chem/lox_lh2_v0.3.2.h5"
group = "/chem/lox_lh2/equilibrium"
pins = "tables/chem/lox_lh2_v0.3.2.pins.toml" # the machine-written single pin owner

[tables.spine_transport]
# OFFL-5 §3.1a; its axes span exactly the equilibrium surface's declared
# envelope, so the two surfaces refuse and accept on the same states (the
# engine cross-checks that at assembly, before any march).
file = "tables/spine/lox_lh2_transport_v0.1.0.h5"
group = "/spine/lox_lh2/transport"
pins = "tables/spine/lox_lh2_transport_v0.1.0.pins.toml"

[determinism]
mode = "fixed-order"

[rng]
master_seed = 11
