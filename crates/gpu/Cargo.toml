# crucible-gpu — the S12 GPU-spike CUDA backend skeleton (PLAN S12; ruling #9).
# DETACHED from the repo workspace on purpose (its own empty [workspace] table):
# it requires nvcc + an NVIDIA GPU, which the laptop CPU reference host and the
# `scripts/check.sh` fast gate do not have. The CPU path stays the bit-exact
# reference (D-H); this crate is opt-in and touches no CPU-produced number.
# Built + run only on the GPU box (RTX 4070 Ti SUPER, over ssh). See SESSION_LOG
# S12 for the measured throughput + the CPU↔GPU tolerance this bin establishes.
[package]
name = "crucible-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
crucible-solvers = { path = "../solvers" }
crucible-grid = { path = "../grid" }
crucible-tables = { path = "../tables" }
# S13c geometry leg: the revolved RL10 contour clip (Contour) + the contour
# CSV parser — the ◆C3 cut 3-D fixture is built from the geometry of record.
crucible-config = { path = "../config" }
crucible-engine = { path = "../engine" }
toml = "0.8"

[[bin]]
name = "gpu_spike"
path = "src/main.rs"

# S13 residency cross-check: the resident class-A RHS on device vs the
# bit-exact CPU `Euler::eval_rhs` on a real (r,z) fixture.
[[bin]]
name = "residency_xcheck"
path = "src/residency_xcheck.rs"

# S13b residency cross-check: the class-D per-component symmetric CG resident on
# device vs the bit-exact CPU `GasDiffusion::cg_solve` on a real (r,z) fixture.
[[bin]]
name = "residency_diffusion_xcheck"
path = "src/residency_diffusion_xcheck.rs"

# S13c residency cross-check: the class-D affine diffusion FORCING
# (fill_lag_gradients + assemble_rates) resident vs the bit-exact CPU reference.
[[bin]]
name = "residency_assemble_xcheck"
path = "src/residency_assemble_xcheck.rs"

# S13c residency cross-check: the FULL RESIDENT class-D gas Picard iterate
# (forcing + rhs + solver composed on-device) vs the bit-exact CPU reference.
[[bin]]
name = "residency_iterate_xcheck"
path = "src/residency_iterate_xcheck.rs"

# S13c residency cross-check: the real HDF5 TableEos (p,h,Z) projection resident
# vs the bit-exact CPU TableEos on the production equilibrium surface.
[[bin]]
name = "residency_eos_xcheck"
path = "src/residency_eos_xcheck.rs"

# S13c residency cross-check: the combustion source (Nagumo + front diffusion)
# resident vs the bit-exact CPU Combustion::accumulate_inner.
[[bin]]
name = "residency_combustion_xcheck"
path = "src/residency_combustion_xcheck.rs"

# S13c residency cross-check: the blend EOS (p,h,Z) mid-b projection resident vs
# the bit-exact CPU BurnBlendEos::prim_checked (the class-R prerequisite).
[[bin]]
name = "residency_blend_eos_xcheck"
path = "src/residency_blend_eos_xcheck.rs"

# S13c residency cross-check: the class-R implicit auto-ignition node solve
# (BE-at-frozen-τ + the full prim_checked three-way branch select) resident vs
# the bit-exact CPU Combustion::implicit_auto_update.
[[bin]]
name = "residency_class_r_xcheck"
path = "src/residency_class_r_xcheck.rs"

# S13c residency cross-check: the class-A step on the REAL 3-D cut geometry
# (uniform N_θ > 1 revolved RL10 contour, axis parity, θ-sweep, wall ghosts,
# wall closure, SRD) resident vs the bit-exact CPU eval_rhs / apply_srd /
# Sdc::step_flow.
[[bin]]
name = "residency_geometry_xcheck"
path = "src/residency_geometry_xcheck.rs"

# S13c CLOSE: the COMPOSED full-physics 3-D resident engine step (blend EOS +
# general-EOS HLLC + inflow/outflow + igniter + combustion + class-R + SRD +
# audit reductions + front-carrier stable_dt) vs the CPU Sdc::step on the real
# rl10_startup_3d assembly.
[[bin]]
name = "residency_engine_xcheck"
path = "src/residency_engine_xcheck.rs"

# S14: the OVERNIGHT HARNESS — the resident engine marched under the run's
# schedule with the COUP-4 verdict probes on the host, FND-6 checkpoint /
# resume-with-verify to disk, halt artifacts. The ◆C4 driver.
[[bin]]
name = "gpu_engine_run"
path = "src/gpu_engine_run.rs"

# Empty table = this crate is its OWN workspace root, so the repo-root
# `cargo build --workspace` / check.sh never pull it in (no nvcc on the laptop).
[workspace]
